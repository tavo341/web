    <!-- Scripts -->
    <script>
      document.getElementById('formato').addEventListener('change', function() {
        const formatoSeleccionado = this.value;
        const viFields = document.querySelectorAll('.vi-exclusive');

        // Mostrar todos los campos por defecto
        viFields.forEach(field => field.style.display = 'block');
        document.getElementById('codigo-patrimonial').parentNode.style.display = 'block';
        document.getElementById('correlat').parentNode.style.display = 'block';
        document.getElementById('denominacion-bien').parentNode.style.display = 'block';
        document.getElementById('forma-adquisicion').parentNode.style.display = 'block';
        document.getElementById('entidad-procedencia').parentNode.style.display = 'block';
        document.getElementById('fecha-adquisicion').parentNode.style.display = 'block';
        document.getElementById('valor-libros').parentNode.style.display = 'block';
        document.getElementById('datos-adquisicion').parentNode.style.display = 'block';
        document.getElementById('unidad-medida').parentNode.style.display = 'block';
        document.getElementById('estado-bien').parentNode.style.display = 'block';
        document.getElementById('usuario').parentNode.style.display = 'block';
        document.getElementById('area').parentNode.style.display = 'block';
        document.getElementById('largo').parentNode.style.display = 'block';
        document.getElementById('ancho').parentNode.style.display = 'block';
        document.getElementById('alto').parentNode.style.display = 'block';
        document.getElementById('marca').parentNode.style.display = 'block';
        document.getElementById('modelo').parentNode.style.display = 'block';
        document.getElementById('color').parentNode.style.display = 'block';
        document.getElementById('n-serie').parentNode.style.display = 'block';
        document.getElementById('caracteristicas-adicionales').parentNode.style.display = 'block';

        // Si el formato seleccionado es VI, ocultar los campos adicionales
        if (formatoSeleccionado === 'VI') {
          document.getElementById('codigo-patrimonial').parentNode.style.display = 'none';
          document.getElementById('largo').parentNode.style.display = 'none';
          document.getElementById('ancho').parentNode.style.display = 'none';
          document.getElementById('alto').parentNode.style.display = 'none';
          document.getElementById('marca').parentNode.style.display = 'none';
          document.getElementById('modelo').parentNode.style.display = 'none';
          document.getElementById('color').parentNode.style.display = 'none';
          document.getElementById('n-serie').parentNode.style.display = 'none';

        }
      });
